${ARM_SIDE_PREFIX}_controller:
  ros__parameters:
    type: joint_trajectory_controller/JointTrajectoryController
    joints:
      - ${ARM_SIDE_PREFIX}_1_joint
      - ${ARM_SIDE_PREFIX}_2_joint
      - ${ARM_SIDE_PREFIX}_3_joint
      - ${ARM_SIDE_PREFIX}_4_joint
      - ${ARM_SIDE_PREFIX}_5_joint
      - ${ARM_SIDE_PREFIX}_6_joint
      - ${ARM_SIDE_PREFIX}_7_joint
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity

    gains:
      ${ARM_SIDE_PREFIX}_1_joint:
        p: 200.0
        i: 0.0
        d: 10.0
      ${ARM_SIDE_PREFIX}_2_joint:
        p: 500.0
        i: 0.0
        d: 10.0
      ${ARM_SIDE_PREFIX}_3_joint:
        p: 300.0
        i: 0.0
        d: 10.0
      ${ARM_SIDE_PREFIX}_4_joint:
        p: 300.0
        i: 0.0
        d: 10.0
      ${ARM_SIDE_PREFIX}_5_joint:
        p: 100.0
        i: 0.0
        d: 2.0
      ${ARM_SIDE_PREFIX}_6_joint:
        p: 50.0
        i: 0.0
        d: 2.0
      ${ARM_SIDE_PREFIX}_7_joint:
        p: 50.0
        i: 0.0
        d: 2.0

    interpolate_from_desired_state: true

    constraints:
      goal_time: 0.6
      stopped_velocity_tolerance: 5.0
      ${ARM_SIDE_PREFIX}_1_joint:
        goal: 0.02
      ${ARM_SIDE_PREFIX}_2_joint:
        goal: 0.02
      ${ARM_SIDE_PREFIX}_3_joint:
        goal: 0.02
      ${ARM_SIDE_PREFIX}_4_joint:
        goal: 0.02
      ${ARM_SIDE_PREFIX}_5_joint:
        goal: 0.02
      ${ARM_SIDE_PREFIX}_6_joint:
        goal: 0.02
      ${ARM_SIDE_PREFIX}_7_joint:
        goal: 0.02
