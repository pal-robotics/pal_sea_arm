${ARM_SIDE_PREFIX}_controller:
  ros__parameters:
    type: joint_trajectory_controller/JointTrajectoryController
    joints:
      - ${ARM_SIDE_PREFIX}_1_joint
      - ${ARM_SIDE_PREFIX}_2_joint
      - ${ARM_SIDE_PREFIX}_3_joint
      - ${ARM_SIDE_PREFIX}_4_joint
      - ${ARM_SIDE_PREFIX}_5_joint
    command_interfaces:
      - position
    state_interfaces:
      - position

    gains:
      ${ARM_SIDE_PREFIX}_1_joint:
        p: 0.0
        i: 0.0
        d: 0.0
      ${ARM_SIDE_PREFIX}_2_joint:
        p: 0.0
        i: 0.0
        d: 0.0
      ${ARM_SIDE_PREFIX}_3_joint:
        p: 0.0
        i: 0.0
        d: 0.0
      ${ARM_SIDE_PREFIX}_4_joint:
        p: 0.0
        i: 0.0
        d: 0.0
      ${ARM_SIDE_PREFIX}_5_joint:
        p: 0.0
        i: 0.0
        d: 0.0
      ${ARM_SIDE_PREFIX}_6_joint:
        p: 0.0
        i: 0.0
        d: 0.0
      ${ARM_SIDE_PREFIX}_7_joint:
        p: 0.0
        i: 0.0
        d: 0.0

    interpolate_from_desired_state: true
    constraints:
      goal_time: 0.6
      stopped_velocity_tolerance: 5.0
      ${ARM_SIDE_PREFIX}_1_joint:
        goal: 0.02
      ${ARM_SIDE_PREFIX}_2_joint:
        goal: 0.02
      ${ARM_SIDE_PREFIX}_3_joint:
        goal: 0.02
      ${ARM_SIDE_PREFIX}_4_joint:
        goal: 0.02
      ${ARM_SIDE_PREFIX}_5_joint:
        goal: 0.02